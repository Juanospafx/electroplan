<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ElectroPlan iOS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing:border-box; margin:0; }
    body { background:#0b1120; color:#f8fafc; min-height:100vh; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #loading-screen { position:fixed; inset:0; background:#0b1120; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    .spinner { width:40px; height:40px; border:3px solid rgba(251,90,58,0.2); border-top-color:#fb5a3a; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #offline-screen { display:none; flex-direction:column; min-height:100vh; padding:24px; }
    .offline-header { margin-bottom:28px; }
    .offline-header h1 { font-size:1.4rem; font-weight:700; }
    .offline-header p { color:#94a3b8; font-size:0.82rem; margin-top:4px; }
    .offline-project-card { display:flex; align-items:center; gap:14px; background:#1e293b; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px; margin-bottom:12px; }
    #last-sync-time { font-size:0.72rem; color:#64748b; margin-bottom:16px; }
    .retry-btn { background:#fb5a3a; color:#fff; border:none; padding:12px 28px; border-radius:50px; font-weight:700; font-size:0.95rem; margin-top:20px; width:100%; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div style="font-size:2.5rem;">⚡</div>
    <div class="spinner"></div>
    <p style="color:#94a3b8; font-size:0.85rem;">Connecting...</p>
  </div>

  <div id="offline-screen">
    <div class="offline-header">
      <div style="font-size:2rem; margin-bottom:8px;">⚡</div>
      <h1>ElectroPlan</h1>
      <p>Offline mode — cached data</p>
    </div>
    <div id="last-sync-time"></div>
    <div id="offline-projects"></div>
    <button class="retry-btn" onclick="window.location.reload()">
      <i class="fas fa-wifi me-2"></i> Retry Connection
    </button>
  </div>

  <script type="module" src="./js/app-init.js"></script>
</body>
</html>
