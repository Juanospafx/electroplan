<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectroPlan Offline</title>
  <meta name="theme-color" content="#0b1120">
  <style>
    :root { color-scheme: dark; --bg: #0b1120; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #f97316; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
    main { width: min(420px, 100%); background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 28px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
    img { width: 76px; height: 76px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
    button { border: 0; border-radius: 999px; padding: 11px 18px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/pwa-icon.svg" alt="">
    <h1>You are offline</h1>
    <p>ElectroPlan needs a connection for live project data. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
