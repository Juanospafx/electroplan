name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies from root lock
        run: composer install --prefer-dist --no-interaction

      - name: PHP syntax check
        run: |
          set -e
          files=$(find . -name "*.php" -not -path "./vendor/*")
          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi
          for f in $files; do php -l "$f" > /dev/null; done
          echo "PHP lint OK"

      - name: Run SSO Composer pipeline contract
        run: php tests/sso_composer_pipeline_contract.test.php

      - name: Run complete eight-suite SSO aggregate contract and timeout proof
        run: php tests/sso_client_contract.test.php
