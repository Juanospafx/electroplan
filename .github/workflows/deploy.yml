name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: electroplan-production
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy artifact
        run: |
          mkdir -p deploy_artifact
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.env*' \
            --exclude='config.local.php' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='harness/' \
            --exclude='schemas/' \
            --exclude='apps/' \
            --exclude='node_modules/' \
            --exclude='logs/' \
            --exclude='dumps/' \
            --exclude='temp/' \
            --exclude='tmp/' \
            --exclude='cache/' \
            --exclude='*.md' \
            --exclude='*.sql' \
            --exclude='db/' \
            --exclude='db/migrations/' \
            --exclude='deploy_artifact/' \
            ./ deploy_artifact/
          test -d deploy_artifact/api
          test -d deploy_artifact/core
          test -d deploy_artifact/assets
          test -f deploy_artifact/index.php
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > deploy_artifact/deployment_manifest.json
          {
            "format_version": "1.0.0",
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "generated_at_utc": "${NOW_UTC}",
            "workflow_run_id": "${{ github.run_id }}"
          }
          EOF
          (cd deploy_artifact && find . -type f ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          test -f deploy_artifact/deployment_manifest.json
          test -f deploy_artifact/SHA256SUMS

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP en puerto 21 se conserva y documenta por falta de evidencia de soporte FTPS en el servidor de destino
          port: 21
          local-dir: ./deploy_artifact/
          server-dir: ./
          dangerous-clean-slate: false
